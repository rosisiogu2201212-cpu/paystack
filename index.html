kground:#f7f7f7}.divider{border:0;border-top:1px solid var(--line);margin:25px 0}.bar-title{font-weight:bold;background:#d5d5d5;border:1px solid #555;padding:5px;margin-bottom:15px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}.option{display:flex;align-items:center;gap:9px;min-height:42px;padding:7px;border:1px solid transparent;border-radius:4px}.option:has(input:checked){border-color:#abd6bd;background:#f3faf5}.option input{accent-color:var(--green);width:17px;height:17px}.paylogo{font-weight:bold;color:#13446e}.proceed-wrap{text-align:right;margin-top:28px}.btn{border:0;border-radius:4px;padding:10px 16px;background:#a4acb0;color:#fff}.btn:enabled{background:var(--green)}.btn.primary{background:var(--green)}.btn.secondary{background:#edf2ef;color:#38594a}.notice{border:1px solid #ead68e;background:#fff9e9;color:#765b15;padding:12px 14px;border-radius:4px;font-size:13px;margin:14px 0}.field{display:block;margin:13px 0;color:#586770}.field input,.field select{width:100%;padding:10px;border:1px solid #ccd5d7;border-radius:4px;margin-top:5px}.statement table{width:100%;border-collapse:collapse}.statement th,.statement td{padding:11px;border:1px solid var(--line);text-align:left}.statement th{background:#f4f6f5}.success{font-size:50px;color:var(--green);text-align:center}.empty{padding:24px;background:#fafbfa;border:1px dashed #ccd4d1;color:#66756d}.mobile-overlay{display:none}

.brand{height:60px;overflow:visible}.brand-logo{display:block;width:188px;height:65px;object-fit:contain;max-width:none}.sidebar{background:#f8f8f8}.profile{padding:0;border:0;background:#f8f8f8}.home-photo{height:50px;padding-top:16px;text-align:center}.home-photo img{font-size:14px}.home-detail{border-top:1px solid #555;border-bottom:1px solid #555;padding:20px 18px 0;color:#71808a;font-size:16px}.home-detail .row{height:20px;margin-bottom:32px;white-space:nowrap}.home-detail .row:last-of-type{margin-bottom:32px}.home-detail .program{margin-left:27px;line-height:23px;padding-bottom:15px}.account-photo{height:45px;padding:14px 12px 0}.account-photo img{font-size:14px}.account-name{font-weight:bold;margin:0 29px 5px;color:#657987}.my-profile{margin:0 29px 23px;color:#71808a;font-size:14px}.nav .parent{height:45px;padding:11px 18px;border-top:1px solid #ddd;border-bottom:1px solid #ddd}.nav .sub{height:37px;padding:8px 7px;margin:0 14px 8px 28px;width:calc(100% - 42px);background:#f4f4f4;border:0;text-align:left;display:block}.nav .report{margin-top:21px}.topbar{left:var(--sidebar);top:0;height:60px;padding:0 20px 0 13px}.topbar .hamb{order:0}.topbar .user-menu{order:1;margin-left:auto}.topbar .crumb{order:2;margin-left:18px}.crumb{font-size:16px;color:#798690}.crumb span{color:#798690}.main{padding:60px 0 50px}.collapsed .sidebar{transform:none}.collapsed .profile,.collapsed .nav{display:none}.collapsed .topbar{left:var(--sidebar)}.collapsed .main{margin-left:var(--sidebar)}.home-grid{grid-template-columns:repeat(4,355px);column-gap:36px;row-gap:128px;margin:48px 0 0 18px}.tile-icon{background:none!important;width:130px;height:120px;border-radius:0;display:flex;align-items:center;justify-content:center}.tile-icon img{display:block;width:130px;height:120px;object-fit:contain}.tile:nth-child(1) .tile-icon{background:none!important;border-radius:0;width:130px;height:120px}.tile:nth-child(1) .tile-icon img{width:130px;height:120px}.tile{height:158px;min-height:158px;gap:7px}.tile label{font-size:16px}.card{width:876px;max-width:calc(100vw - var(--sidebar) - 30px);margin-left:10px}.card-head{font-size:29px;height:64px;padding:14px 23px}.card-body{min-height:674px;padding:24px 24px 43px}.summary{margin:0 0 66px;font-size:16px}.summary caption{padding:5px 2px}.summary th,.summary td{padding:6px 5px}.divider{margin:0 0 48px}.bar-title{margin:0 0 14px;padding:4px 2px}.options{grid-template-columns:1fr 1fr;grid-template-rows:40px 40px;align-content:start;gap:10px 20px;min-height:164px}.option{font-size:18px;min-height:40px;padding:0;border:0!important;background:none!important;gap:7px}.option input{width:15px;height:15px;flex:none}.option span img{height:32px;width:auto;max-width:242px;object-fit:contain;vertical-align:middle;margin-left:7px}.option:first-child span img{height:34px}.card-body>.divider:nth-of-type(2){margin:0 0 96px}.card-body>.last-divider{margin:0 0 48px}.proceed-wrap{margin:0 -19px 0 0}.btn{padding:9px 13px}.btn:disabled{background:#a4acb0}

<body><div class="demo">DEMO PORTAL · Sample student data · No real sign-in or payments are processed</div><div class="shell" id="shell">
<aside class="sidebar" id="sidebar"><div class="brand"><img src="assets/university-logo.png" alt="Covenant University" class="brand-logo"></div><div class="profile" id="profile"></div><nav class="nav" id="nav"></nav></aside><div class="mobile-overlay" id="overlay"></div>
<header class="topbar"><button class="hamb" id="hamb" aria-label="Toggle navigation">☰</button><div class="crumb" id="crumb"></div><button class="user-menu" id="userMenu">♟ Roy ▾</button></header><main class="main" id="main"></main></div>
<script>
const state={page:'home',payStep:0,method:'',receipt:null};
const nav=document.querySelector('#nav'),main=document.querySelector('#main'),crumb=document.querySelector('#crumb'),profile=document.querySelector('#profile');
function go(page){state.page=page;state.payStep=0;render();document.querySelector('#sidebar').classList.remove('open');document.querySelector('#overlay').classList.remove('show')}
function renderNav(){const accountOpen=['account','payment','statement','receipt'].includes(state.page);document.querySelector('#shell').classList.toggle('collapsed',['payment','statement','receipt'].includes(state.page));if(state.page==='home'){profile.innerHTML='<div class="home-photo"><img src="assets/missing-user.png" alt="User Image"></div><div class="home-detail"><div class="row">▤ &nbsp; Osarenkhoe Osamudiamen</div><div class="row short">♟</div><div class="row">▣ &nbsp; 22CK031380</div><div class="row">▣ &nbsp; 400 Level</div><div class="program">Program - Computer<br>Engineering</div></div>';nav.innerHTML=''}else if(accountOpen&&state.page!=='payment'&&state.page!=='statement'&&state.page!=='receipt'){profile.innerHTML='<div class="account-photo"><img src="assets/missing-user.png" alt="User Image"></div><div class="account-name">Hello, Osarenkhoe</div><div class="my-profile">♟ &nbsp;My Profile</div>';nav.innerHTML='<button class="parent">▤ &nbsp; Payment</button><button class="sub" data-page="payment">Make Payments</button><button class="sub" data-page="receipt">Receipt</button><button class="parent report">▤ &nbsp; Report</button>'}else{profile.innerHTML='';nav.innerHTML=''}nav.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function head(title,eyebrow='Student Portal'){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div></div>`}
function home(){return `<div class="grid home-grid">${[['account','<img src="assets/tile-account.png" alt="">','student account',''],['academic','<img src="assets/tile-planning.png" alt="">','academic planning',''],['resumption','<img src="assets/tile-resumption.png" alt="">','resumption',''],['affairs','<img src="assets/missing-affairs.png" alt="icon name">','student affairs',''],['course','<img src="assets/tile-course-control.png" alt="">','course control',''],['attendance','<img src="assets/tile-attendance.png" alt="">','attendance',''],['results','<img src="assets/tile-results.png" alt="">','result processing','']].map(([p,i,t,c])=>`<a href="#${p}" class="tile" data-page="${p}"><span class="tile-icon ${c}">${i}</span><label>${t}</label></a>`).join('')}</div>`}
function payment(){return `<section class="card"><div class="card-head">Make Payment <a class="link" href="#statement" data-page="statement">Click to view statement of account</a></div><div class="card-body"><table class="summary"><caption>Account Summary</caption><thead><tr><th>B/F</th><th>School Fees</th><th>Other Charges</th><th>TotalBill</th><th>TotalPaid</th><th>TotalRefund</th><th>Balance</th></tr></thead><tbody><tr><td>0</td><td>2,021,575</td><td>61,720</td><td>2,083,295</td><td>0</td><td>0</td><td><strong>2,083,295</strong></td></tr></tbody></table><hr class="divider"><div class="bar-title">Select Payment Option</div><div class="options">${[['CUPIN','CUPIN <img src="assets/payment-cupin.png" alt="Covenant University PIN">'],['Interswitch','Interswitch <img src="assets/payment-interswitch.png" alt="Interswitch, Verve, Mastercard, Visa">'],['Paystack Card','Paystack Card <img src="assets/payment-paystack.png" alt="Paystack">'],['Paystack Others','Paystack Others <img src="assets/payment-paystack.png" alt="Paystack">']].map(([m,l])=>`<label class="option"><input type="radio" name="method" value="${m}" ${state.method===m?'checked':''}><span>${l}</span></label>`).join('')}</div><hr class="divider"><hr class="divider last-divider"><div class="proceed-wrap"><button class="btn" id="proceed" ${state.method?'':'disabled'}>Proceed &gt;&gt;</button></div></div></section>`}
function paymentReview(){return `<section class="card"><div class="card-head">Review Payment</div><div class="card-body"><p>Selected method: <strong>${state.method}</strong></p><p>Amount to pay: <strong>₦<span id="amountLabel">100,000</span></strong></p><label class="field">Demo payment amount (₦)<input id="amount" type="number" min="100" value="100000"></label><div class="notice">This is a simulated frontend flow. Continuing will only create a sample receipt in this browser; it will not contact a bank or payment service.</div><button class="btn secondary" id="back">Back</button> <button class="btn primary" id="simulate">Simulate demo payment</button></div></section>`}
function statement(){return `<section class="card statement"><div class="card-head">Statement of Account <a class="link" href="#payment" data-page="payment">Make Payment</a></div><div class="card-body"><table><thead><tr><th>Date</th><th>Description</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody><tr><td>Sample</td><td>Opening balance</td><td>—</td><td>—</td><td>₦0</td></tr><tr><td>Sample</td><td>School fees</td><td>₦2,021,575</td><td>—</td><td>₦2,021,575</td></tr><tr><td>Sample</td><td>Other charges</td><td>₦61,720</td><td>—</td><td>₦2,083,295</td></tr><tr><td>Sample</td><td>Payments received</td><td>—</td><td>₦0</td><td>₦2,083,295</td></tr></tbody></table><div class="notice">Illustrative sample entries only. These are not official student records.</div></div></section>`}
function receipt(){return `<section class="card"><div class="card-head">Payment Receipt</div><div class="card-body">${state.receipt?`<div class="success">✓</div><h2>Demo payment recorded</h2><p>Reference: <strong>${state.receipt.ref}</strong></p><p>Method: ${state.receipt.method}</p><p>Amount: ₦${Number(state.receipt.amount).toLocaleString()}</p><p>Date: ${state.receipt.date}</p><div class="notice">This sample receipt confirms only a local demo action; no real payment was made.</div><button class="btn secondary" onclick="window.print()">Print sample receipt</button>`:`<div class="empty">No demo receipt yet. Complete a simulated payment to see it here.</div><p><button class="btn primary" data-page="payment">Go to Make Payments</button></p>`}</div></section>`}
function placeholder(){const titles={academic:'Academic Planning',resumption:'Resumption',affairs:'Student Affairs',course:'Course Control',attendance:'Attendance',results:'Result Processing',report:'Reports',account:'Student Account'};if(state.page==='account')return '';return `${head(titles[state.page]||'Student Portal')}<div class="empty">This section is ready to be built when you share its reference screen.</div><p><button class="btn secondary" data-page="home">Back to dashboard</button></p>`}
function render(){renderNav();document.querySelector('#userMenu').innerHTML='♟ '+(state.page==='home'?'Osamudiamen':'Osarenkhoe')+' ▾';crumb.innerHTML=state.page==='home'?'':`<a href="#home" data-page="home">⌂ Home</a> &nbsp; / &nbsp; <span>Student Account</span>`;main.innerHTML=state.page==='home'?home():state.page==='payment'?(state.payStep===0?payment():paymentReview()):state.page==='statement'?statement():state.page==='receipt'?receipt():placeholder();main.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();go(el.dataset.page)}));main.querySelectorAll('input[name="method"]').forEach(el=>el.addEventListener('change',()=>{state.method=el.value;document.querySelector('#proceed').disabled=false}));const proceed=document.querySelector('#proceed');if(proceed)proceed.onclick=()=>{state.payStep=1;render()};const back=document.querySelector('#back');if(back)back.onclick=()=>{state.payStep=0;render()};const amount=document.querySelector('#amount');if(amount)amount.oninput=()=>document.querySelector('#amountLabel').textContent=Number(amount.value||0).toLocaleString();const simulate=document.querySelector('#simulate');if(simulate)simulate.onclick=()=>{const val=Number(amount.value);if(!val||val<100){amount.focus();amount.setCustomValidity('Enter a demo amount of at least ₦100');amount.reportValidity();return}state.receipt={ref:'DEMO-'+Math.random().toString(36).slice(2,9).toUpperCase(),method:state.method,amount:val,date:new Date().toLocaleString()};state.page='receipt';render()}}
document.querySelector('#hamb').onclick=()=>{if(innerWidth<=720){document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#overlay').classList.toggle('show')}else document.querySelector('#shell').classList.toggle('collapsed')};document.querySelector('#overlay').onclick=()=>{document.querySelector('#sidebar').classList.remove('open');document.querySelector('#overlay').classList.remove('show')};document.querySelector('#userMenu').onclick=()=>alert('Demo profile · Alex Student');render();
</script><script src="reference-app.js"></script></body></html>
